services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./www:/var/www/html
    networks:
      bitrix_internal:
      existing_proxy:
        aliases:
          - bitrix-web
    mem_limit: 768m
    cpus: 0.75
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Yekaterinburg
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=40
      - --skip-log-bin
    volumes:
      - bitrix_db:/var/lib/mysql
    networks:
      - bitrix_internal
    mem_limit: 640m
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  bitrix_db:

networks:
  bitrix_internal:
    internal: true
  existing_proxy:
    external: true
    name: alrus-vpn_default
